name: CI · .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build + Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Detectar solution
        id: detect
        run: |
          if compgen -G "*.sln" > /dev/null || compgen -G "**/*.csproj" > /dev/null; then
            echo "has_project=true" >> $GITHUB_OUTPUT
          else
            echo "has_project=false" >> $GITHUB_OUTPUT
            echo "::notice::Nenhum projeto .NET ainda — CI passa em vazio."
          fi

      - name: Setup .NET 8
        if: steps.detect.outputs.has_project == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        if: steps.detect.outputs.has_project == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: dotnet restore
        if: steps.detect.outputs.has_project == 'true'
        run: dotnet restore

      - name: dotnet build (Release)
        if: steps.detect.outputs.has_project == 'true'
        run: dotnet build --no-restore --configuration Release

      - name: dotnet format (warning, não falha)
        if: steps.detect.outputs.has_project == 'true'
        continue-on-error: true
        run: dotnet format --verify-no-changes --severity warn

      - name: dotnet test (se existir)
        if: steps.detect.outputs.has_project == 'true'
        continue-on-error: true
        run: dotnet test --no-build --configuration Release --verbosity normal
